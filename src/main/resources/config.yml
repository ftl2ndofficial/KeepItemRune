# KeepItemRune configuration
# Supports Minecraft 1.21 - 26.3 (Paper & Folia)
# Discord: https://discord.knualabs.icu

config-version: 1

# Settings for the rune item used to protect equipment
rune:
  material: "AMETHYST_SHARD"
  name: "<gradient:#FF55FF:#55FFFF><bold>Keep Item Rune</bold></gradient>"
  lore:
    - "<gray>Drag and drop onto an item in your inventory"
    - "<gray>to protect it from dropping on death."
    - ""
    - "<dark_gray>Consumed upon death.</dark_gray>"
  glow: true

# Lore line appended (client-side) below any existing lore on protected items
lore: "<b><gradient:#FF1515:#FF7373>PROTECTED FROM DEATH</gradient></b>"

# Sound effects played to players.
# Set enabled: false or sound: "NONE" to disable a specific sound.
sounds:
  apply-success:
    enabled: true
    sound: "BLOCK_ENCHANTMENT_TABLE_USE"
    volume: 1.0
    pitch: 1.2
  apply-fail:
    enabled: true
    sound: "ENTITY_VILLAGER_NO"
    volume: 1.0
    pitch: 1.0
  death-trigger:
    enabled: true
    sound: "BLOCK_AMETHYST_CLUSTER_BREAK"
    volume: 1.2
    pitch: 0.8
  respawn-restore:
    enabled: true
    sound: "ITEM_TOTEM_USE"
    volume: 0.6
    pitch: 1.2
  remove-success:
    enabled: true
    sound: "BLOCK_GRINDSTONE_USE"
    volume: 1.0
    pitch: 1.0

# Visual particle effects when a player carrying protected items dies or respawns.
# Set enabled: false or particle: "NONE" to disable a specific effect.
effects:
  death:
    enabled: true
    particle: "TOTEM_OF_UNDYING"
    count: 35
    offset-x: 0.4
    offset-y: 0.8
    offset-z: 0.4
    speed: 0.15
  respawn:
    enabled: true
    particle: "END_ROD"
    count: 25
    offset-x: 0.4
    offset-y: 0.8
    offset-z: 0.4
    speed: 0.08
    totem-animation: false

# Items that can be protected with a rune.
# Use "*" to allow all items.
whitelist-items:
